<svg viewBox="0 0 1000 320" role="img" aria-label="Focuship Architecture: Static Next.js frontend deployed to a Cloudflare Worker edge with local Web Audio engine and service worker, connected via Sanctum cookie sessions to a Laravel API with a unified Library backing both account endpoints and a Passport OAuth 2.1 MCP server." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-m" d="M0 0L8 4L0 8z"/></marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-ma" d="M0 0L8 4L0 8z"/></marker>
  </defs>

  <!-- Zone 1: Cloudflare Edge & Browser -->
  <rect class="d-zone" x="20" y="24" width="460" height="270" rx="8"/>
  <text class="d-z" x="36" y="46">Frontend · Cloudflare Worker &amp; PWA Shell (focuship.app)</text>

  <!-- Box: Static App Shell -->
  <rect class="d-box" x="40" y="70" width="180" height="64" rx="6"/>
  <text class="d-t" x="130" y="98" text-anchor="middle">Next.js App Shell</text>
  <text class="d-s" x="130" y="116" text-anchor="middle">static export · out/</text>

  <!-- Box: Service Worker & Cache -->
  <rect class="d-box" x="40" y="155" width="180" height="64" rx="6"/>
  <text class="d-t" x="130" y="183" text-anchor="middle">Service Worker</text>
  <text class="d-s" x="130" y="201" text-anchor="middle">sw.js · offline cache</text>

  <!-- Box: Web Audio Engine -->
  <rect class="d-box" x="270" y="70" width="190" height="149" rx="6"/>
  <text class="d-t" x="365" y="105" text-anchor="middle">Web Audio Engine</text>
  <text class="d-s" x="365" y="125" text-anchor="middle">dual-deck crossfading</text>
  <text class="d-s" x="365" y="145" text-anchor="middle">noise &amp; drone synthesis</text>
  <text class="d-s" x="365" y="165" text-anchor="middle">MediaSession lockscreen</text>
  <text class="d-s" x="365" y="185" text-anchor="middle">zero-network cached audio</text>

  <!-- Internal arrows frontend -->
  <line class="d-l" x1="130" y1="134" x2="130" y2="151" marker-end="url(#ah)"/>
  <line class="d-l" x1="220" y1="102" x2="266" y2="102" marker-end="url(#ah)"/>

  <!-- Zone 2: Backend API & MCP Server -->
  <rect class="d-zone" x="520" y="24" width="460" height="270" rx="8"/>
  <text class="d-z" x="536" y="46">Backend · Laravel 11 API &amp; MCP (api.focuship.app)</text>

  <!-- Box: Unified Library -->
  <rect class="d-box" x="650" y="70" width="200" height="64" rx="6"/>
  <text class="d-t" x="750" y="98" text-anchor="middle">App\Account\Library</text>
  <text class="d-s" x="750" y="116" text-anchor="middle">presets · caps · settings</text>

  <!-- Box: Sanctum Session Auth -->
  <rect class="d-box" x="540" y="155" width="180" height="64" rx="6"/>
  <text class="d-t" x="630" y="183" text-anchor="middle">Sanctum Auth</text>
  <text class="d-s" x="630" y="201" text-anchor="middle">cookie session · SPA mode</text>

  <!-- Box: Passport OAuth 2.1 MCP Server -->
  <rect class="d-box" x="750" y="155" width="210" height="64" rx="6"/>
  <text class="d-t" x="855" y="183" text-anchor="middle">Passport OAuth MCP</text>
  <text class="d-s" x="855" y="201" text-anchor="middle">16 tools · RFC 8414 PKCE</text>

  <!-- Connectors backend -->
  <line class="d-l" x1="630" y1="155" x2="710" y2="136" marker-end="url(#ah)"/>
  <line class="d-l" x1="855" y1="155" x2="780" y2="136" marker-end="url(#ah)"/>

  <!-- Cross-zone connection: Edge to API -->
  <line class="d-a" x1="220" y1="187" x2="536" y2="187" marker-end="url(#aa)"/>
  <text class="d-at" x="380" y="179" text-anchor="middle">Sanctum Credentials (Cookie / CSRF)</text>

  <!-- Outer note: AI Assistant to MCP -->
  <line class="d-a" x1="970" y1="187" x2="964" y2="187"/>
</svg>
